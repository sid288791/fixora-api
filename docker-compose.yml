version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Keep (keep-backend / keep-frontend / keep-api-proxy / keep-websocket-server)
# ─────────────────────────────────────────────────────────────────────────────
# These services build from ./keep and ./keep/keep-ui — an external clone of
# https://github.com/keephq/keep that is NOT part of this repo (too large to
# vendor in git). On a fresh checkout, `docker compose up` will fail on these
# services with "path not found" until you've cloned Keep locally.
#
# Quick start (from fixora-api/):
#   ./scripts/setup-keep.sh
#
# What that script does, step by step (do this manually if you'd rather not run it):
#   1. git clone --depth 1 https://github.com/keephq/keep.git keep
#   2. Fix line endings: on Windows, git checks Keep's *.sh files out with CRLF,
#      which corrupts their #!/bin/sh shebang inside the Linux containers and
#      causes cryptic "not found" / "no such file or directory" failures at
#      build or container-startup time. Run:
#        find keep -name "*.sh" -not -path "*/node_modules/*" -exec sed -i 's/\r$//' {} \;
#   3. docker compose up -d --build postgres redis keep-websocket-server \
#        keep-backend keep-api-proxy keep-frontend
#   4. If keep-backend keeps restarting after step 3, Docker likely reused a
#      cached image built before step 2's fix — force a clean rebuild:
#        docker compose build --no-cache keep-backend
#        docker compose up -d keep-backend
#
# Full debugging story / architecture notes: docs/keep.md
# Keep UI once running: http://localhost:3000 — API: :8080 (direct) / :8082 (nginx proxy, injects
# the X-API-Key header Keep's API requires even with AUTH_TYPE=NO_AUTH)
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    container_name: fixora_postgres
    environment:
      POSTGRES_DB: fixora_db
      POSTGRES_USER: fixora_user
      POSTGRES_PASSWORD: fixora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/00-create-keep-db.sql:/docker-entrypoint-initdb.d/00-create-keep-db.sql
      - ./scripts/00-create-goalert-db.sql:/docker-entrypoint-initdb.d/01-create-goalert-db.sql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixora_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixora-network

  # NOTE: fixora-api runs locally via `./gradlew bootRun` for now.
  # Once we start adding more services (Redis, Kafka, etc.) we can
  # containerize the API here too and wire it up via `depends_on`.

  redis:
    image: redis:7-alpine
    container_name: fixora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixora-network

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    container_name: fixora_keep_ws
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      - SOKETI_USER_AUTHENTICATION_TIMEOUT=3000
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=keepappkey
      - SOKETI_DEFAULT_APP_SECRET=keepappsecret
    networks:
      - fixora-network
    restart: unless-stopped

  keep-backend:
    build:
      context: ./keep
      dockerfile: docker/Dockerfile.api
    container_name: fixora_keep_backend
    environment:
      - PORT=8080
      - AUTH_TYPE=NO_AUTH
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/state
      - DATABASE_CONNECTION_STRING=postgresql://keep_user:keep_password@postgres:5432/keep_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PUSHER_APP_ID=1
      - PUSHER_APP_KEY=keepappkey
      - PUSHER_APP_SECRET=keepappsecret
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - USE_NGROK=false
    ports:
      - "8080:8080"
    volumes:
      - keep_state:/state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keep-websocket-server:
        condition: service_started
    networks:
      - fixora-network
    restart: unless-stopped

  keep-api-proxy:
    image: nginx:alpine
    container_name: fixora_keep_api_proxy
    ports:
      - "8082:8080"
    volumes:
      - ./docker/keep-api-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keep-backend
    networks:
      - fixora-network
    restart: unless-stopped

  keep-frontend:
    build:
      context: ./keep/keep-ui
      dockerfile: ../docker/Dockerfile.ui
    container_name: fixora_keep_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=secret-change-this
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_TYPE=NO_AUTH
      # Server-side (Next.js server, running inside the container) talks to keep-backend over the docker network
      - API_URL=http://keep-api-proxy:8080
      # Client-side (browser) talks to keep-backend via the published host port
      - API_URL_CLIENT=http://localhost:8082
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - PUSHER_APP_KEY=keepappkey
    depends_on:
      - keep-backend
      - keep-api-proxy
      - keep-websocket-server
    networks:
      - fixora-network
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # GoAlert (target/goalert) — on-call scheduling, escalation policies, and
  # SMS/voice paging via Twilio. Sits alongside Keep: for alert configs with
  # severity=="critical" and a goalertServiceUrl set, Keep's workflow posts to
  # GoAlert's generic alert-ingestion API (POST /api/v2/generic/incoming?token=...)
  # which resolves who's on-call and pages them. Fixora/Keep never talks to
  # Twilio directly — GoAlert owns that integration internally.
  #
  # First-time setup after `docker compose up -d goalert`:
  #   1. Start a tunnel (e.g. ngrok) pointing at :8081 — Twilio's webhooks need
  #      a real internet-reachable URL, localhost won't work for that part.
  #   2. Open the tunnel URL in a browser, Admin > Config: set General.PublicURL
  #      to the tunnel URL.
  #   3. Admin > Config > Twilio: enable it, paste your Account SID, Auth Token,
  #      and "From Number" (a Twilio trial number is fine for dev — trial calls
  #      prepend a short disclaimer message). Set the Twilio messaging/voice
  #      callback URLs in the Twilio console to
  #      <tunnel-url>/api/v2/twilio/message and <tunnel-url>/api/v2/twilio/call.
  #   4. Run `./scripts/setup-goalert.sh` (from fixora-api/) — creates the admin
  #      user and provisions a default Service + Escalation Policy + Generic API
  #      Integration Key via GoAlert's GraphQL API, then prints the webhook URL.
  #      This replaces steps that used to be manual UI clicking (create
  #      Service/Escalation Policy/Integration Key) — see script header comment
  #      for env vars (GOALERT_URL, GOALERT_ADMIN_USER/PASS, etc).
  #   5. Paste the printed webhook URL into an AlertConfiguration's
  #      goalertServiceUrl field in the Fixora UI. If GOALERT_URL was a
  #      localhost address, swap "localhost" for "host.docker.internal" in that
  #      URL first — Keep's http action runs inside the keep-backend container
  #      and needs to reach back out to the Docker host (same gotcha as the
  #      AI RCA server, see the fixora-rca-ai repo's README).
  #
  # Still inherently manual (can't be scripted around): the Twilio account
  # signup itself, and the tunnel. Everything else is one script.
  #
  # Full setup + test checklist: docs/goalert-setup.md
  # ───────────────────────────────────────────────────────────────────────────
  goalert:
    image: goalert/goalert:latest
    container_name: fixora_goalert
    environment:
      - GOALERT_DB_URL=postgres://goalert_user:goalert_password@postgres:5432/goalert_db?sslmode=disable
      - GOALERT_DATA_ENCRYPTION_KEY=fixora-dev-goalert-encryption-key-change-me
      - GOALERT_LISTEN_ADDR=:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fixora-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  keep_state:

networks:
  fixora-network:
    driver: bridge
